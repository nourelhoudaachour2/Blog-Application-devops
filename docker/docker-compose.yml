version: '3.8'
services:
  backend:
    build: ../backend
    ports:
      - "3001:3001"
    networks:
      - blog-network

  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
