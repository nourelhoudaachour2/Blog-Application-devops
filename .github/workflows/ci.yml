name: CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Lint
        run: |
          cd backend
          npm run lint

      - name: Test
        run: |
          cd backend
          npm test

      - name: Build Docker image
        run: |
          docker build -t blog-backend:latest ./backend
          docker build -t blog-frontend:latest ./frontend
